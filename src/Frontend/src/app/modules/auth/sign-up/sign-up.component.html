<main class="sign-up-page">
  <div class="brand-block">
    <app-logo></app-logo>
  </div>

  <app-base-container class="sign-up-card">
    <header class="sign-up-header">
      <h1>Create your account</h1>
      <p>Join VocabLab and start building your vocabulary today</p>
    </header>

    <div class="sign-up-form">
      <div class="form-field">
        <label for="name">First Name</label>
        <input pInputText type="text" id="name" placeholder="John" [(ngModel)]="firstName" />
      </div>

      <div class="form-field">
        <label for="lastname">Last Name</label>
        <input pInputText type="text" id="lastname" placeholder="Doe" [(ngModel)]="lastName" />
      </div>

      <div class="form-field">
        <label for="email">E-mail</label>
        <input pInputText type="text" id="email" placeholder="name@example.com" [(ngModel)]="email" />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <p-password id="password" [(ngModel)]="password" [toggleMask]="true" placeholder="password"/>
      </div>

      <div class="terms-agreement">
        <p-checkbox [(ngModel)]="agreeToTerms" [binary]="true" inputId="terms"></p-checkbox>
        <label for="terms" class="terms-label">
          I agree to the <a href="">Terms of Service</a> and <a href="">Privacy Policy</a>
        </label>
      </div>

      <button pButton label="Create Account" class="create-account-btn"></button>
    </div>

    <div class="auth-divider">
      <hr>
      <span>OR CONTINUE WITH</span>
      <hr>
    </div>

    <div class="social-sign-up">
      <button
        pButton
        type="button"
        class="social-sign-up-google"
        icon="pi pi-google"
        label="Continue with Google"
      ></button>
    </div>
  </app-base-container>

  <div class="login-prompt">
    <span>Already have an account?</span> <a routerLink="/sign-in">Log in</a>
  </div>
</main>
